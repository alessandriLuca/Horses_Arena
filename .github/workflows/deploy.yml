name: Test e deploy su Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    # pubblica solo da main e solo se i segreti di Cloudflare sono configurati
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Controllo segreti
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Manca il segreto CLOUDFLARE_API_TOKEN: salto il deploy (vedi README)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # toglie spazi e "a capo" finiti per sbaglio nei segreti
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')"
          echo "Lunghezza Account ID: ${#CLOUDFLARE_ACCOUNT_ID} (deve essere 32)"
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            # se nel segreto c'è un URL o testo in più, prova a estrarre l'ID; altrimenti usa l'account del token
            EXTRACTED="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-f]{32}' | head -1 || true)"
            if [ -n "$EXTRACTED" ]; then export CLOUDFLARE_ACCOUNT_ID="$EXTRACTED"; echo "Account ID estratto dal segreto."
            else unset CLOUDFLARE_ACCOUNT_ID; echo "Account ID non valido: uso l'account associato al token."; fi
          fi
          echo "Account a cui il token ha accesso:"
          npx wrangler whoami || true
          npx wrangler deploy
