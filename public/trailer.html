<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horses Arena — Trailer</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #v{position:fixed;inset:0}
  .vh-board,.vh-controls,.vh-top,.vh-toasts{display:none!important}
  .cap{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);width:min(980px,94vw);text-align:center;color:#fff;font-family:"M PLUS Rounded 1c",sans-serif;font-size:clamp(20px,3.4vw,40px);font-weight:900;-webkit-text-stroke:1.6px #1b1a3a;paint-order:stroke fill;text-shadow:4px 4px 0 #1b1a3a;z-index:20;opacity:0;transition:opacity .25s}
  .cap.on{opacity:1}
  .card-t{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .25s;
    background:repeating-conic-gradient(from 0deg at 50% 50%,#ff8fc8 0 10deg,#ffd1e8 10deg 20deg)}
  .card-t.on{opacity:1}
  .card-t h1{font-family:"Dela Gothic One",sans-serif;font-size:clamp(34px,8vw,110px);margin:0 4vw;text-align:center;line-height:1.05;color:#fff;-webkit-text-stroke:4px #1b1a3a;paint-order:stroke fill;text-shadow:8px 8px 0 #1b1a3a;transform:rotate(-4deg);animation:wob .4s infinite alternate}
  .card-t p{font-family:"Dela Gothic One",sans-serif;font-size:clamp(18px,3.4vw,40px);margin:0;color:#ffcc33;-webkit-text-stroke:2px #1b1a3a;paint-order:stroke fill;text-shadow:4px 4px 0 #1b1a3a;transform:rotate(2deg)}
  @keyframes wob{to{transform:rotate(3deg) scale(1.05)}}
  .flash{position:fixed;inset:0;background:#fff;z-index:25;opacity:0;pointer-events:none}
  .flash.go{animation:fl .35s}
  @keyframes fl{0%{opacity:.9}100%{opacity:0}}
  #play{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,#6ec6ff,#ff8fc8);cursor:pointer}
  #play h1{font-family:"Dela Gothic One",sans-serif;font-size:clamp(36px,8vw,96px);margin:0;color:#fff;-webkit-text-stroke:3px #1b1a3a;paint-order:stroke fill;text-shadow:6px 6px 0 #1b1a3a}
  #play button{font:900 24px "M PLUS Rounded 1c",sans-serif;padding:14px 30px;border-radius:16px;border:3px solid #1b1a3a;background:#fff;box-shadow:5px 5px 0 #1b1a3a;cursor:pointer}
  #play small{color:#1b1a3a;font:800 15px sans-serif}
</style>
</head>
<body>
<div id="v"></div>
<div class="flash" id="flash"></div>
<div class="card-t" id="card"><h1 id="cardH"></h1><p id="cardP"></p></div>
<div class="cap" id="cap"></div>
<div id="play"><h1>🏇 HORSES ARENA 🤪</h1><button>▶ PLAY THE TRAILER</button><small>sound ON 🔊 (narration by your browser)</small></div>
<script type="module">
import { openViewer } from "/js/race3d/viewer.js";
const rep = await (await fetch("/trailer-replay.json")).json();
let qn = {};
try { qn = Object.fromEntries((await (await fetch("/api/catalog")).json()).quirks.map((q) => [q.id, q.name])); } catch {}
const viewer = openViewer(document.getElementById("v"), { replay: rep, info: { name: "Gran Premio della Follia", startAt: 0 }, live: false, startT: -8, myOwner: null, quirkName: (q) => (qn[q] ?? q.replace(/_/g, " ")).toUpperCase() });
window.ready = true;

const ev = rep.events;
const first = (pred) => ev.find(pred);
const fallEvs = ev.filter((e) => e.k === "fall");
const winner = rep.finish.find((f) => f.pos === 1);
const winIdx = winner ? rep.horses.findIndex((h) => h.num === winner.num) : 0;
const finishT = (ev.find((e) => e.k === "finish" && e.v === 1) || { t: rep.duration - 4 }).t;

// [tipo, tempo, cavallo, camera, testo narrazione, durata, cartello?]
const shots = [];
const add = (e, line, dur = 4.2, cam = "event") => { if (e) shots.push({ t: e.t - 1.2, a: e.a, cam, line, dur }); };
shots.push({ card: ["SINCE UNIVERSITY", "one dream..."], line: "Ever since university, I had one dream: a horse racing game. Then I lost my mind.", dur: 4.8 });
shots.push({ t: -3, a: 0, cam: "tv", line: "Welcome to Horses Arena. The most serious horse racing simulator in the world.", dur: 6 });
add(first((e) => e.k === "quirk" && e.q === "gas_propulsore" && e.t > 8), "This horse had beans for breakfast. Jet propulsion: engaged.");
add(first((e) => e.k === "quirk" && (e.q === "urlatore" || e.q === "morsicatore") && e.t > 8), "This one screams like an opera singer. The bar just lost every glass.");
shots.push({ card: ["REAL PHYSICS", "(sort of)"], line: "Real physics!", dur: 1.8 });
add(fallEvs[0], "Watch the jockey fly! Weeeeee!", 5);
add(first((e) => e.k === "quirk" && e.q === "retromarcia"), "This one does the moonwalk. In the middle of a race.");
add(first((e) => e.k === "incident" && e.q === "🛸"), "Aliens. Of course there are aliens.", 5);
add(first((e) => e.k === "quirk" && (e.q === "calciatore" || e.q === "morsicatore")), "Kung fu kick! Totally legal. Probably.");
add(first((e) => e.k === "incident" && e.q === "🥪"), "Grandma brought the jockey a sandwich. During the race.", 5);
add(fallEvs[2] || fallEvs[1], "Pile up! Call the vet! And the priest!", 4.5);
add(first((e) => e.k === "incident" && e.q === "🦖"), "Is that a dinosaur? Nobody knows. Nobody asks.", 4.5);
add(first((e) => e.k === "quirk" && e.q === "disarcionatore"), "Bye bye, jockey!");
shots.push({ card: ["120 CRAZY QUIRKS", "119 absurd incidents"], line: "One hundred and twenty crazy quirks. Over a hundred absurd incidents.", dur: 4.5 });
shots.push({ card: ["HITMEN · DOPING", "DETECTIVES · GRANDMA"], line: "Hitmen. Doping. Private detectives. Insurance. Horses that learn their fears. And Grandma Pina on commentary.", dur: 6.5 });
shots.push({ t: finishT - 3, a: winIdx, cam: "tv", line: "And the winner... does a backflip. Because why not.", dur: 6 });
shots.push({ card: ["HORSES ARENA", "come lose your mind with us"], line: "Horses Arena. My dream since university, inspired by those crazy Japanese horse racing videos. Come lose your mind with us!", dur: 8 });

function voice() {
  const vs = speechSynthesis.getVoices().filter((v) => v.lang && v.lang.startsWith("en"));
  return vs.find((v) => /google uk|daniel|samantha|aria|jenny|guy/i.test(v.name)) || vs[0] || null;
}
function say(text, excited) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); const v = voice(); if (v) u.voice = v; u.lang = "en-GB"; u.rate = excited ? 1.15 : 1.05; u.pitch = excited ? 1.35 : 1.1; speechSynthesis.speak(u); } catch {}
  const c = document.getElementById("cap"); c.textContent = text; c.classList.add("on");
}
const flash = () => { const f = document.getElementById("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); };

document.getElementById("play").onclick = async () => {
  document.getElementById("play").remove();
  for (const s of shots) {
    flash();
    const card = document.getElementById("card");
    if (s.card) {
      document.getElementById("cardH").textContent = s.card[0];
      document.getElementById("cardP").textContent = s.card[1];
      card.classList.add("on");
    } else {
      card.classList.remove("on");
      viewer.seek(s.t);
      if (s.cam === "event") { viewer.setCam("tv"); viewer.scene.focusEvent(s.a ?? 0, s.t, s.dur + 1.5); }
      else viewer.setCam(s.cam, s.a ?? 0);
    }
    say(s.line, !s.card);
    await new Promise((r) => setTimeout(r, s.dur * 1000));
  }
};
</script>
</body>
</html>
